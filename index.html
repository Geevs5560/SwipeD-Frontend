
<!DOCTYPE html>
<html lang="en" class="bg-gray-50 dark:bg-[#0B0E14]">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>SwipeD - Crypto Platform</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            fontFamily: {
              sans: ['Roboto', 'sans-serif'],
              mono: ['JetBrains Mono', 'monospace'],
            },
            colors: {
              crypto: {
                dark: '#0B0E14',
                card: '#151A25',
                accent: 'var(--accent-color)',
                success: 'var(--accent-color)',
                warning: '#F59E0B',
                danger: '#EF4444',
              }
            },
            animation: {
              'swipe-success': 'swipeRight 1.5s ease-in-out forwards',
              'dance': 'dance 2s infinite ease-in-out',
              'shine': 'shine 3s infinite linear',
              'grid-flow': 'gridFlow 20s linear infinite',
              'sync-pulse': 'syncPulse 2s infinite ease-in-out',
              'float': 'float 6s infinite ease-in-out',
              'letter-join': 'letterJoin 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) forwards',
              'pop-in': 'popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards',
            },
            keyframes: {
              swipeRight: {
                '0%': { width: '0%', left: '0%', opacity: '0' },
                '20%': { opacity: '1' },
                '100%': { width: '100%', left: '0%', opacity: '0' },
              },
              dance: {
                '0%, 100%': { transform: 'translateY(0) rotate(0) scale(1)' },
                '25%': { transform: 'translateY(-5px) rotate(-3deg) scale(1.02)' },
                '75%': { transform: 'translateY(-2px) rotate(3deg) scale(1.02)' },
              },
              shine: {
                '0%': { transform: 'translateX(-200%)' },
                '100%': { transform: 'translateX(200%)' }
              },
              gridFlow: {
                '0%': { backgroundPosition: '0 0' },
                '100%': { backgroundPosition: '0 50px' }
              },
              syncPulse: {
                '0%, 100%': { opacity: '0.4', transform: 'scale(1)' },
                '50%': { opacity: '0.8', transform: 'scale(1.02)' },
              },
              float: {
                '0%, 100%': { transform: 'translateY(0) rotate(0)' },
                '50%': { transform: 'translateY(-20px) rotate(5deg)' },
              },
              letterJoin: {
                '0%': { transform: 'translateX(-40px) scale(0) rotate(-45deg)', opacity: '0' },
                '100%': { transform: 'translateX(0) scale(1) rotate(0)', opacity: '1' },
              },
              popIn: {
                '0%': { transform: 'scale(0)', opacity: '0' },
                '100%': { transform: 'scale(1)', opacity: '1' },
              }
            }
          }
        }
      }
    </script>
    <style>
      :root {
        --accent-color: #10B981;
        --accent-glow: rgba(16, 185, 129, 0.3);
      }

      html, body {
        height: 100%;
        margin: 0;
        padding: 0;
        background-color: #F9FAFB;
        font-family: 'Roboto', sans-serif;
      }
      
      html.dark, html.dark body {
        background-color: #0B0E14 !important;
      }

      body {
        transition: background-color 0.3s ease, color 0.3s ease;
        -webkit-tap-highlight-color: transparent;
        overflow-x: hidden;
        overflow-y: auto;
      }

      .premium-3d-grid {
        background-image: 
          linear-gradient(to right, rgba(255, 255, 255, 0.05) 0.5px, transparent 0.5px),
          linear-gradient(to bottom, rgba(255, 255, 255, 0.05) 0.5px, transparent 0.5px);
        background-size: 50px 50px;
        transform: perspective(1000px) rotateX(65deg) scale(2);
        transform-origin: center top;
      }

      .animate-in {
        animation-fill-mode: both;
      }
      .fade-in {
        animation: fadeIn 0.4s ease-in-out forwards;
      }
      .zoom-in {
        animation: zoomIn 0.4s ease-in-out forwards;
      }
      .slide-in-from-right {
        animation: slideInRight 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }
      .slide-in-from-left {
        animation: slideInLeft 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }

      @keyframes fadeIn {
        from { opacity: 0; }
        to { opacity: 1; }
      }
      @keyframes zoomIn {
        from { opacity: 0; transform: scale(0.95); }
        to { opacity: 1; transform: scale(1); }
      }
      @keyframes slideInRight {
        from { opacity: 0; transform: translateX(30px); }
        to { opacity: 1; transform: translateX(0); }
      }
      @keyframes slideInLeft {
        from { opacity: 0; transform: translateX(-30px); }
        to { opacity: 1; transform: translateX(0); }
      }

      .no-scrollbar::-webkit-scrollbar {
        display: none;
      }
      .no-scrollbar {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "recharts": "https://esm.sh/recharts@^3.6.0",
    "react": "https://esm.sh/react@^19.2.3",
    "react/": "https://esm.sh/react@^19.2.3/",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "lucide-react": "https://esm.sh/lucide-react@^0.562.0"
  }
}
</script>
<link rel="stylesheet" href="/index.css">
</head>
  <body class="bg-gray-50 dark:bg-crypto-dark text-gray-900 dark:text-white">
    <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
